services:
  mysql:
    image: mysql:9
    container_name: wild-learning-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: wild123!@#
      MYSQL_DATABASE: wild_learning_db
      MYSQL_USER: wilduser
      MYSQL_PASSWORD: wild123!@#
    ports:
      - "3307:3306"
    volumes:
      # 초기화 스크립트 (컨테이너 생성 시 자동 실행)
      - ./docker/mysql/initdb:/docker-entrypoint-initdb.d
      # 데이터 영속성
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pwild123!@#"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
